<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textify — Login</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="render-banner">
  <div class="spinner"></div>
  <p class="banner-text">
    <span>Waking up the server...</span>
    This may take up to 50 seconds on first load. Please wait.
  </p>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-panel">
      <h1>Textify</h1>
      <p>Real-time messaging, redefined.<br>Connect instantly, anywhere.</p>
      <button id="toggleBtn">Switch to Register</button>
    </div>
    <div class="auth-forms">
      <form id="loginForm" class="form active">
        <h2>Welcome back</h2>
        <input type="email" placeholder="Email address" required id="loginEmail">
        <input type="password" placeholder="Password" required id="loginPassword">
        <button type="submit">Login</button>
      </form>
      <form id="registerForm" class="form">
        <h2>Create account</h2>
        <input type="text" placeholder="Username" required id="registerUsername">
        <input type="email" placeholder="Email address" required id="registerEmail">
        <input type="password" placeholder="Password" required id="registerPassword">
        <button type="submit">Register</button>
      </form>
    </div>
  </div>
</div>

<script src="./js/auth.js"></script>
<script>
  const API_URL = "https://textify-zluc.onrender.com";
  const banner = document.getElementById("render-banner");
  document.body.classList.add("banner-active");

  async function wakeServer() {
    try {
      const res = await fetch(`${API_URL}/`);
      if (res.ok) {
        banner.classList.add("hidden");
        document.body.classList.remove("banner-active");
      } else {
        setTimeout(wakeServer, 3000);
      }
    } catch (e) {
      setTimeout(wakeServer, 3000);
    }
  }
  wakeServer();
</script>
</body>
</html>
